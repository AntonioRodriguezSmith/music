name: Release Windows (unsigned)

# Builds MSI + NSIS via npm run tauri -- build (scripts/tauri-windows.ps1 → setup-windows-env.ps1).
# MSVC is resolved with vswhere (Enterprise/BuildTools on GitHub Actions) or known VS paths.
# Pin CARGO_TARGET_DIR to the repo so upload-artifact matches the bundle path.
# Locally, setup-windows-env.ps1 defaults to %LOCALAPPDATA%\clip_harbour-target if unset.

on:
  workflow_dispatch:

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run fetch:sidecars:windows
      - name: Build installers
        run: npm run tauri -- build
      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "$env:CARGO_TARGET_DIR/release/bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installers-unsigned
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
