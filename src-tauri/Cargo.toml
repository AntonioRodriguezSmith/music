[package]
name = "clip_harbour"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clip_harbour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MSVC link.exe progress in non-English locales ("Creando biblioteca…") is
# forwarded as warn(linker_messages) by rustc 1.97+; English form is filtered.
# See https://github.com/rust-lang/rust/issues/159133
[lints.rust]
linker_messages = "allow"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

# Signals (SIGTSTP/SIGCONT) power pause/resume only on desktop Unix; Android
# reports unix but has no signal delivery for our children, so it is excluded.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
nix = { version = "0.29.0", features = ["signal"] }
